<section id="testimonios" class="scroll-mt-20 py-16 md:py-24">
  <div class="mx-auto max-w-6xl px-4">
    <h2 class="text-center font-serif text-3xl font-bold text-tostado sm:text-4xl">Lo que dicen nuestros clientes</h2>

    <ul class="mt-12 grid gap-6 md:grid-cols-3">
      @for (testimonio of testimonios; track testimonio.nombre) {
        <li class="flex">
          <figure class="flex w-full flex-col justify-between rounded-2xl border border-tostado/15 bg-white p-6 shadow-sm">
            <blockquote class="text-lg text-tostado">“{{ testimonio.cita }}”</blockquote>
            <figcaption class="mt-6 flex items-center gap-3">
              <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-tostado font-semibold text-crema" aria-hidden="true">
                {{ testimonio.nombre.charAt(0) }}
              </span>
              <span>
                <span class="block font-semibold text-tostado">{{ testimonio.nombre }}</span>
                <span class="block text-sm text-tostado/70">{{ testimonio.detalle }}</span>
              </span>
            </figcaption>
          </figure>
        </li>
      }
    </ul>
  </div>
</section>
