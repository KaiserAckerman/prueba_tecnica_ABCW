<header class="sticky top-0 z-50 border-b border-tostado/15 bg-crema/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a href="#inicio" class="font-serif text-2xl font-bold text-tostado focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-acento">
      Tostadero Brisa
    </a>

    <nav aria-label="Principal" class="hidden md:block">
      <ul class="flex gap-8">
        @for (enlace of enlaces; track enlace.href) {
          <li>
            <a [href]="enlace.href" class="font-medium text-tostado hover:text-acento focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-acento">
              {{ enlace.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <button
      type="button"
      class="rounded-md p-2 text-tostado focus-visible:outline-2 focus-visible:outline-acento md:hidden"
      aria-controls="menu-movil"
      [attr.aria-expanded]="menuAbierto()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="alternarMenu()"
    >
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        @if (menuAbierto()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>

  @if (menuAbierto()) {
    <nav id="menu-movil" aria-label="Principal móvil" class="border-t border-tostado/15 md:hidden">
      <ul class="mx-auto flex max-w-6xl flex-col px-4 py-2">
        @for (enlace of enlaces; track enlace.href) {
          <li>
            <a [href]="enlace.href" (click)="cerrarMenu()" class="block py-3 font-medium text-tostado hover:text-acento focus-visible:outline-2 focus-visible:outline-acento">
              {{ enlace.texto }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
