<section id="caracteristicas" class="scroll-mt-20 py-16 md:py-24">
  <div class="mx-auto max-w-6xl px-4">
    <h2 class="text-center font-serif text-3xl font-bold text-tostado sm:text-4xl">Por qué Tostadero Brisa</h2>
    <p class="mx-auto mt-4 max-w-2xl text-center text-lg text-tostado/90">
      Cuidamos el café desde el grano hasta tu taza.
    </p>

    <ul class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (item of caracteristicas; track item.titulo) {
        <li class="rounded-2xl border border-tostado/15 bg-white p-6 text-center shadow-sm">
          <span class="text-4xl" aria-hidden="true">{{ item.icono }}</span>
          <h3 class="mt-4 font-serif text-xl font-bold text-tostado">{{ item.titulo }}</h3>
          <p class="mt-2 text-tostado/90">{{ item.descripcion }}</p>
        </li>
      }
    </ul>
  </div>
</section>
